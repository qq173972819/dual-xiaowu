[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xiaowu-s3-open-platform"
version = "0.1.0"
description = "Open business platform for XiaoWu ESP32-S3 e-paper devices"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["xiaowu_platform*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
